# coddy's MR check: the merge request must close an issue that is open and
# assigned. Keyed on the closing references ("Closes #n"), not the branch name,
# so a branch an agent named itself passes. Open and assigned, not the "in
# progress" label: /coddy:ship takes the label off when it opens the merge
# request and this runs again on every push, while claim's assignee holds until
# the merge.
# GitLab computes the references only on a merge request against the project's
# default branch; on one stacked on another branch the closing keywords in the
# description are read directly, so a link made another way is not seen there.
# No stage: it runs in the default one, test. Not .pre, since a pipeline holding
# only .pre and .post jobs does not run. A project whose stages: omits test must
# add it, or set a stage for this job in .gitlab-ci.yml.
# The token is the CI variable CODDY_TOKEN when set (read_api, masked, not
# protected: a protected variable does not reach a merge request pipeline from
# an unprotected branch), else the job token, which may not be allowed to read
# these endpoints.
# ponytail: any assignee counts, not only the merge request's author.
closes a claimed issue:
  image: alpine:3.22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      out=$(mktemp) list=$(mktemp)
      if [ -n "${CODDY_TOKEN:-}" ]; then auth="PRIVATE-TOKEN: $CODDY_TOKEN"; else auth="JOB-TOKEN: $CI_JOB_TOKEN"; fi
      # api <path under the project>: the response in $out; anything but a 200 ends the job.
      api() {
        code=$(curl -sS -o "$out" -w '%{http_code}' -H "$auth" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/$1") || { echo "the GitLab API could not be reached for $1."; exit 1; }
        case $code in
          200) ;;
          401|403) echo "GitLab answered $code for $1: this job's token cannot read it. Set the CI variable CODDY_TOKEN to a token with read_api, masked and not protected (a protected variable does not reach a merge request pipeline from an unprotected branch), then re-run this job."; exit 1 ;;
          *) echo "GitLab answered $code for $1."; exit 1 ;;
        esac
      }
      issue='"\(.iid) \(.state) \(.assignees | length)"'
      api "merge_requests/$CI_MERGE_REQUEST_IID/closes_issues?per_page=100"
      jq -r ".[] | $issue" "$out" > "$list"
      if [ ! -s "$list" ] && [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" != "$CI_DEFAULT_BRANCH" ]; then
        # Stacked on another branch: GitLab computes no references, so read the description's closing keywords, from the API since the predefined variable is truncated.
        api "merge_requests/$CI_MERGE_REQUEST_IID"
        for n in $(jq -r '.description // ""' "$out" | grep -oiE '(^|[^[:alnum:]])(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]:]*#[0-9]+' | grep -oE '[0-9]+' | sort -un); do
          api "issues/$n"
          jq -r "$issue" "$out" >> "$list"
        done
      fi
      [ -s "$list" ] || { echo "no linked issue. Add 'Closes #<issue>' to the merge request description, then re-run this job: editing the description starts no pipeline."; exit 1; }
      bad=0
      while read -r n state assigned; do
        [ "$state" = opened ] || { echo "#$n is $state, not open. Reopen it or close another issue from the description, then re-run this job."; bad=1; }
        [ "$assigned" != 0 ] || { echo "#$n is not claimed: nobody is assigned. Run /coddy:start $n or assign yourself, then re-run this job."; bad=1; }
      done < "$list"
      exit "$bad"
