# What `verify` in .coddy.yml runs locally, plus shellcheck, on every push
# to main and every PR. jj comes from its release binary, checked against a
# pinned sha256, so the self-test runs both worktree legs; git, jq and node
# are on the runner images already. The macos job runs both self-tests under
# /bin/bash 3.2, the bash macOS ships, which every script must parse and run
# under.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install jj
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo jj.tar.gz https://github.com/jj-vcs/jj/releases/download/v0.46.0/jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz
          echo "fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08  jj.tar.gz" | sha256sum -c -
          sudo tar -xzf jj.tar.gz -C /usr/local/bin ./jj
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck -S warning bin/coddy scripts/*.sh get.sh
      - run: bash scripts/selftest.sh
      - run: bash scripts/selftest-core.sh
      - run: npm install -g @anthropic-ai/claude-code@2.1.317
      # no --strict: the warning about CLAUDE.md at the plugin root is expected
      - run: claude plugin validate .
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: parse under /bin/bash
        run: for f in bin/coddy scripts/*.sh get.sh; do /bin/bash -n "$f"; done
      - name: put /bin/bash first on PATH
        run: echo /bin >> "$GITHUB_PATH"
      - name: the bash on PATH
        run: command -v bash && bash --version && [ "$(command -v bash)" = /bin/bash ]
      - name: install jj
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo jj.tar.gz https://github.com/jj-vcs/jj/releases/download/v0.46.0/jj-v0.46.0-aarch64-apple-darwin.tar.gz
          echo "43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58  jj.tar.gz" | shasum -a 256 -c -
          sudo tar -xzf jj.tar.gz -C /usr/local/bin ./jj
      # selftest-core.sh calls timeout, which macOS lacks; Homebrew's coreutils installs it unprefixed
      - run: command -v timeout || brew install coreutils
      - run: bash scripts/selftest.sh
      - run: bash scripts/selftest-core.sh
