# Tags and releases each version bump: on a push to main whose
# .claude-plugin/plugin.json holds another version than before the push, it
# creates tag v<version> on the pushed commit, a merge commit since PRs merge
# with one, and a GitHub release listing the feat: and fix: subjects since the
# previous v* tag. A push that leaves the version as it was does nothing. A
# version whose tag is already on origin fails, with nothing created or moved:
# gh release create alone would hang a release on that tag. gh creates the tag
# through the API, so the checkout keeps no push credential. The run block
# reads its inputs from env alone, so scripts/selftest.sh runs it against a
# stub gh. A failed run is rerun from the Actions page.
name: release
on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          ver() { git show "$1:.claude-plugin/plugin.json" 2>/dev/null | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
          # BEFORE is all zeros for a new branch and gone after a force push: read the first parent then.
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE=HEAD^
          new=$(ver HEAD) old=$(ver "$BEFORE")
          [ -n "$new" ] || { echo "::error::no version in .claude-plugin/plugin.json."; exit 1; }
          [ "$new" != "$old" ] || { echo "version is still $new: nothing to tag."; exit 0; }
          found=0; git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null || found=$?
          [ "$found" != 0 ] || { echo "::error::tag v$new is already on origin: nothing created or moved. Bump the version again."; exit 1; }
          [ "$found" = 2 ] || { echo "::error::could not list origin's tags: nothing created."; exit 1; }
          prev=$(git tag --merged HEAD -l 'v[0-9]*' --sort=-v:refname | head -1)
          notes=$(mktemp)
          if [ -n "$prev" ]; then
            git log --format=%s "$prev..HEAD" | grep -E '^(feat|fix)(\(.*\))?:' > "$notes" || :
          else
            echo "v$new is the first tagged release." > "$notes"
          fi
          gh release create "v$new" --target "$SHA" --title "v$new" --notes-file "$notes" --repo "$REPO"
